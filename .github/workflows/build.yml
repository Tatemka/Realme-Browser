name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev
          pip install buildozer cython
      
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
[app]
title = Realme Browser
package.name = realmebrowser
package.domain = com.realme.browser
source.dir = .
source.include_exts = py
version = 1.0.0
requirements = python3,kivy
orientation = portrait
android.permissions = INTERNET
android.api = 30
android.minapi = 21
android.ndk = 25c
android.sdk = 30
android.archs = arm64-v8a

[buildozer]
log_level = 2
warn_on_root = 0
EOF
      
      - name: Download SDK with buildozer
        run: |
          buildozer android debug || true
      
      - name: Install build-tools manually
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
          cd ~/.buildozer/android/platform/android-sdk/
          wget -q https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
          unzip -q build-tools_r30.0.3-linux.zip
          rm build-tools_r30.0.3-linux.zip
          mv build-tools_r30.0.3-linux build-tools/30.0.3
          chmod +x build-tools/30.0.3/aidl
          echo "Aidl installed successfully"
      
      - name: Set PATH
        run: |
          echo "$HOME/.buildozer/android/platform/android-sdk/build-tools/30.0.3" >> $GITHUB_PATH
      
      - name: Build APK
        run: |
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeBrowser
          path: bin/*.apk
