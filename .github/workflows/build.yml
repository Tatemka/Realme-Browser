name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Эта инструкция позволит протестировать Node.js 24 уже сейчас,
    # чтобы избежать неожиданностей после 16 июня.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # Шаг 1: Загружаем ваш код
    - name: Checkout code
      uses: actions/checkout@v4

    # Шаг 2: Настраиваем Python (версия 3.11 надёжна для Buildozer)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Шаг 3: Устанавливаем системные зависимости и Buildozer
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
  run: |
    # Удаляем старый файл, если есть проблемы
    rm -f buildozer.spec
    
    # Создаём новый файл прямо в терминале
    cat > buildozer.spec <<EOF
[app]
title = Realme Browser
package.name = realmebrowser
package.domain = com.realme.browser
source.dir = .
source.include_exts = py
version = 1.0.0
requirements = python3,kivy
orientation = portrait
android.permissions = INTERNET
android.api = 30
android.minapi = 21
android.ndk = 25c
android.sdk = 30
android.archs = arm64-v8a

[buildozer]
log_level = 2
warn_on_root = 0
EOF
    
    # Теперь запускаем сборку
    buildozer android debug
    # Шаг 5: Загружаем готовый APK как артефакт сборки
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RealmeBrowser
        path: bin/*.apk
