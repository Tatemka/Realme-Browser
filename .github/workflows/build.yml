name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create buildozer.spec
        run: |
          echo '[app]' > buildozer.spec
          echo 'title = Realme Browser' >> buildozer.spec
          echo 'package.name = realmebrowser' >> buildozer.spec
          echo 'package.domain = com.realme.browser' >> buildozer.spec
          echo 'source.dir = .' >> buildozer.spec
          echo 'source.include_exts = py' >> buildozer.spec
          echo 'version = 1.0.0' >> buildozer.spec
          echo 'requirements = python3,kivy' >> buildozer.spec
          echo 'orientation = portrait' >> buildozer.spec
          echo 'android.permissions = INTERNET' >> buildozer.spec
          echo 'android.api = 30' >> buildozer.spec
          echo 'android.minapi = 21' >> buildozer.spec
          echo 'android.ndk = 25c' >> buildozer.spec
          echo 'android.sdk = 30' >> buildozer.spec
          echo 'android.archs = arm64-v8a' >> buildozer.spec
          echo '' >> buildozer.spec
          echo '[buildozer]' >> buildozer.spec
          echo 'log_level = 2' >> buildozer.spec
          echo 'warn_on_root = 0' >> buildozer.spec
      
      - name: Install buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Run first build (download SDK)
        run: |
          buildozer android debug || true
      
      - name: Install build-tools (fix aidl)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
          cd ~/.buildozer/android/platform/android-sdk/
          wget -q https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
          unzip -q build-tools_r30.0.3-linux.zip
          rm build-tools_r30.0.3-linux.zip
          mkdir -p build-tools/30.0.3
          mv build-tools_r30.0.3-linux/* build-tools/30.0.3/
          chmod +x build-tools/30.0.3/aidl
          echo "Aidl installed"
      
      - name: Build APK
        run: buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeBrowser
          path: bin/*.apk
