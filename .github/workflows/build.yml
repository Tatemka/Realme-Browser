name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev
        pip install buildozer cython
    
    - name: Create buildozer.spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = Realme Browser' >> buildozer.spec
        echo 'package.name = realmebrowser' >> buildozer.spec
        echo 'package.domain = com.realme.browser' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3,kivy' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo 'android.permissions = INTERNET' >> buildozer.spec
        echo 'android.api = 30' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.ndk = 25c' >> buildozer.spec
        echo 'android.sdk = 30' >> buildozer.spec
        echo 'android.archs = arm64-v8a' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
        echo 'warn_on_root = 0' >> buildozer.spec
    
    - name: First buildozer run (download SDK)
      run: |
        # Запускаем buildozer, чтобы он скачал SDK
        buildozer android debug || true
    
    - name: Install build-tools manually
      run: |
        # Путь к sdkmanager
        SDKMANAGER=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
        
        # Если не нашёлся, ищем в другом месте
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER=$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        fi
        
        # Делаем исполняемым
        chmod +x $SDKMANAGER
        
        # Устанавливаем build-tools (aidl будет внутри)
        echo y | $SDKMANAGER "build-tools;30.0.3"
        echo y | $SDKMANAGER "platforms;android-30"
    
    - name: Final build APK
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RealmeBrowser
        path: bin/*.apk
